name: CI

on:
  push:
    branches:
      - main
      - "milestone/**"
      - "wp/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cross-platform-factory:
    name: ${{ matrix.os }} factory gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.85.1

      - name: Install canonical task runner
        run: cargo install just --locked --version 1.40.0

      - name: Bootstrap
        run: just bootstrap

      - name: Run cross-platform gate
        run: just ci

      - name: Run M1 million-shape baseline
        if: matrix.os == 'ubuntu-latest'
        run: just test-m1-geometry

      - name: Generate evidence
        run: |
          just capability-report
          just sbom
          just truth

      - name: Upload programme evidence
        uses: actions/upload-artifact@v4
        with:
          name: programme-evidence-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  linux-container:
    name: Reproducible Linux image
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build factory image
        run: docker build --file Dockerfile.build --tag icstudio-implementation:ci .

      - name: Verify image truth command
        run: docker run --rm icstudio-implementation:ci truth
