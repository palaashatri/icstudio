name: CI

on:
  push:
    branches:
      - main
      - "milestone/**"
      - "wp/**"
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-reactor:
    name: Java reactor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven

      - name: Install Skia runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1

      - name: Verify reactor, conformance oracle, and CycloneDX SBOM (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp verify

      - name: Verify reactor, conformance oracle, and CycloneDX SBOM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp verify

      - name: Enforce dependency licence policy (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -pl java/icstudio-conformance -am test -Dtest=SbomLicencePolicyTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Enforce dependency licence policy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp -pl java/icstudio-conformance -am test -Dtest=SbomLicencePolicyTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: icstudio-sbom-${{ matrix.os }}
          path: target/icstudio.cdx.json
          if-no-files-found: error
          retention-days: 30

  reproducible-factory:
    name: Reproducible Linux image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Build factory image
        run: docker build --file Dockerfile.build --tag icstudio-implementation:ci .

      - name: Verify image truth command
        run: docker run --rm icstudio-implementation:ci truth
