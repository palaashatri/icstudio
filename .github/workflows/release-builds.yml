name: Cross-platform release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-reactor:
    name: Reactor artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven

      - name: Install Skia runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1

      - name: Build and verify reactor (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp verify

      - name: Build and verify reactor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp verify

      - name: Upload module jars and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: icstudio-reactor-${{ matrix.os }}
          path: |
            java/*/target/*.jar
            target/icstudio.cdx.json
          if-no-files-found: error
          retention-days: 30
