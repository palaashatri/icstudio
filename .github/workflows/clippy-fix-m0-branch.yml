name: One-time M0 Clippy fixer

on:
  push:
    branches:
      - milestone/m0-reproducible-factory

permissions:
  contents: write

jobs:
  clippy-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: milestone/m0-reproducible-factory

      - name: Install pinned Rust tooling
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.85.1

      - name: Apply Clippy suggestions and format
        run: |
          cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --locked
          cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/platform
          git commit -m "fix: satisfy strict Clippy gate"
          git push origin HEAD:milestone/m0-reproducible-factory
