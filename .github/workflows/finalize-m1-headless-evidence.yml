name: One-time M1 headless evidence finalizer

on:
  push:
    branches:
      - milestone/m0-reproducible-factory

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: milestone/m0-reproducible-factory
          persist-credentials: true

      - name: Update tests and capability evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          platform = Path('crates/platform/src/lib.rs')
          text = platform.read_text()
          old = 'assert!((score - 5.0).abs() < f64::EPSILON);'
          if old not in text:
              raise SystemExit('root truth-score assertion not found')
          platform.write_text(text.replace(old, 'assert!((score - 6.8).abs() < f64::EPSILON);', 1))

          mcp = Path('crates/platform/tests/mcp_stdio.rs')
          text = mcp.read_text()
          old = '\\"truthScore\\\":5.00'
          if old not in text:
              raise SystemExit('MCP truth-score assertion not found')
          mcp.write_text(text.replace(old, '\\"truthScore\\\":6.80', 1))

          path = Path('.project/capabilities.json')
          data = json.loads(path.read_text())
          data['accepted_commit'] = '8f432b17b9ffbb2dfc1228a5063d6d347b10abb7'
          capabilities = {item['id']: item for item in data['capabilities']}

          capabilities['CAP-PDK-BASE'].update({
              'status': 'candidate',
              'tier': 0,
              'evidence': [
                  'crates/pdk/src/lib.rs',
                  'schemas/pdk-v1.txt',
                  'deterministic technology round trip',
                  'unique layer-purpose and GDS mapping validation',
                  'safe relative model-reference validation',
                  'GitHub Actions run 30776034205 on Ubuntu macOS Windows and pinned non-root Linux container'
              ],
              'limitations': [
                  'Metadata foundation only',
                  'No PCell execution',
                  'No rule-deck runtime',
                  'No compact-model evaluation',
                  'No foundry qualification'
              ]
          })
          capabilities['CAP-IO-GDS'].update({
              'status': 'candidate',
              'tier': 0,
              'evidence': [
                  'crates/formats/src/lib.rs',
                  'bounded GDSII record-framing parser',
                  'length parity offset and truncation regression tests',
                  'GitHub Actions run 30776034205'
              ],
              'limitations': [
                  'Record framing only',
                  'No hierarchy or geometry interpretation',
                  'No import into project state',
                  'No export'
              ]
          })
          capabilities['CAP-WAVE'].update({
              'status': 'candidate',
              'tier': 0,
              'evidence': [
                  'crates/results/src/lib.rs',
                  'schemas/results-v1.txt',
                  'exact IEEE-754 deterministic round trip',
                  'run provenance and bounded signal-vector validation',
                  'GitHub Actions run 30776034205'
              ],
              'limitations': [
                  'Local scalar vectors only',
                  'No streaming compression plotting or complex data',
                  'No solver integration'
              ]
          })
          capabilities['CAP-CONNECT'].update({
              'status': 'candidate',
              'tier': 0,
              'evidence': [
                  'crates/netlist/src/lib.rs',
                  'structural netlist IR',
                  'bounded CMOS inverter SPICE parser test',
                  'source-line diagnostics for malformed input',
                  'GitHub Actions run 30776034205'
              ],
              'limitations': [
                  'Structural IR only',
                  'No schematic connectivity extraction',
                  'No hierarchical parameter semantics',
                  'No ERC',
                  'No electrical device models'
              ]
          })
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Format and validate evidence
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo run --locked --quiet --bin icstudio -- validate

      - name: Commit final evidence
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/platform .project/capabilities.json
          git commit -m "project: finalize M1 headless evidence at 6.8 of 100"
          git push origin HEAD:milestone/m0-reproducible-factory
