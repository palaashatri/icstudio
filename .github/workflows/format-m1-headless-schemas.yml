name: One-time M1 headless schema formatter

on:
  push:
    branches:
      - milestone/m0-reproducible-factory

permissions:
  contents: write

jobs:
  format-and-register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: milestone/m0-reproducible-factory
          persist-credentials: true

      - name: Register all workspace crates in evidence logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/platform/src/lib.rs')
          text = path.read_text()
          old = '''const WORKSPACE_CRATES: &[(&str, &str)] = &[
              ("icstudio-geometry", "crates/geometry/Cargo.toml"),
              ("icstudio-platform", "crates/platform/Cargo.toml"),
              ("icstudio-project", "crates/project/Cargo.toml"),
              ("icstudio-rpc", "crates/rpc/Cargo.toml"),
          ];'''
          new = '''const WORKSPACE_CRATES: &[(&str, &str)] = &[
              ("icstudio-formats", "crates/formats/Cargo.toml"),
              ("icstudio-geometry", "crates/geometry/Cargo.toml"),
              ("icstudio-netlist", "crates/netlist/Cargo.toml"),
              ("icstudio-pdk", "crates/pdk/Cargo.toml"),
              ("icstudio-platform", "crates/platform/Cargo.toml"),
              ("icstudio-project", "crates/project/Cargo.toml"),
              ("icstudio-results", "crates/results/Cargo.toml"),
              ("icstudio-rpc", "crates/rpc/Cargo.toml"),
          ];'''
          if text.count(old) != 1:
              raise SystemExit('workspace crate registry did not match expected source')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply canonical formatting
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          cargo fmt --all

      - name: Commit formatting and registry
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.toml Cargo.lock
          git commit -m "style: format and register M1 headless schema crates"
          git push origin HEAD:milestone/m0-reproducible-factory
