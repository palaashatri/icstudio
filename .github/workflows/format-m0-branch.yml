name: One-time M0 branch formatter

on:
  push:
    branches:
      - milestone/m0-reproducible-factory

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: milestone/m0-reproducible-factory

      - name: Install pinned formatter
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1

      - name: Apply canonical formatting
        run: cargo fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/platform
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:milestone/m0-reproducible-factory
