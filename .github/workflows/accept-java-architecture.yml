name: Accept Java architecture

on:
  push:
    branches:
      - milestone/m0-reproducible-factory

permissions:
  contents: write

jobs:
  accept:
    if: github.repository == 'palaashatri/icstudio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: milestone/m0-reproducible-factory
          persist-credentials: true

      - name: Detect whether migration switch is pending
        id: pending
        shell: bash
        run: |
          if grep -q '^status = "proposed"$' .project/decisions/ADR-0001-java25-swing-pivot.toml; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply accepted architecture and live-truth reset
        if: steps.pending.outputs.needed == 'true'
        run: python3 .project/migrations/accept_java_architecture.py

      - name: Verify architecture contract and evidence parser
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p icstudio-platform --all-targets

      - name: Commit accepted architecture
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .project crates/platform/src/lib.rs crates/platform/src/bin/icstudio-mcp.rs crates/platform/tests/mcp_stdio.rs
          git commit -m "architecture: accept Java 25 Swing authoritative stack"
          git push origin HEAD:milestone/m0-reproducible-factory
