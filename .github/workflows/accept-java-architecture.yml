          adr = adr.replace(
              'next_after_acceptance = "Amend AGENTS.md architecture/repository/toolchain sections, create the detailed implementation plan, reset live truth per migration.truth_policy, then execute J0 and J1 test-first on the same implementation branch."',
              'next_after_acceptance = "Execute WP-0005 test-first on the same implementation branch; M2 remains blocked until CP-JAVA-M1-KERNEL."',
              1,
          )
          if 'approved_by = "user"' not in adr:
              adr = adr.replace('date = "2026-08-30"\n', 'date = "2026-08-30"\napproved_by = "user"\n', 1)
          adr_path.write_text(adr)

          truth_path = Path('.project/truth.json')
          truth = json.loads(truth_path.read_text())
          truth['historical_baseline'] = {
              'checkpoint': 'CP-M1-KERNEL',
              'score': 8.0,
              'architecture': 'Rust + Electron/React M1',
              'credit': 'historical-only'
          }
          truth['active_architecture'] = 'Java 25 + Swing migration (ADR-0001)'
          truth['reported_score'] = 0.0
          truth['assessment'] = (
              'ADR-0001 changed the authoritative implementation stack to Java 25 + Swing. '
              'The prior Rust/Electron M0/M1 implementation remains preserved as CP-M1-KERNEL '
              'and a conformance oracle, but contributes no live implementation credit. J0 must '
              're-establish the Java factory before M0 returns to 2/100; J1 must reproduce M1 '
              'before the score returns to 8/100. M2 is blocked until CP-JAVA-M1-KERNEL is accepted.'
          )
          for milestone in truth['milestones']:
              if milestone['id'] in ('M0', 'M1'):
                  milestone['completion'] = 0.0
                  milestone['status'] = 'migration-required'
          migration_risk = 'Authoritative Java 25/Swing migration is in progress; historical Rust/Electron evidence does not count toward live truth'
          if migration_risk not in truth['known_risks']:
              truth['known_risks'].insert(0, migration_risk)
          truth_path.write_text(json.dumps(truth, indent=2) + '\n')

          capabilities_path = Path('.project/capabilities.json')
          capabilities = json.loads(capabilities_path.read_text())
          capabilities['historical_accepted_commit'] = capabilities.get('accepted_commit')
          capabilities['accepted_commit'] = ''
          capabilities['active_architecture'] = 'Java 25 + Swing migration (ADR-0001)'
          capabilities['migration_oracle_checkpoint'] = 'CP-M1-KERNEL'
          for capability in capabilities['capabilities']:
              if capability.get('status') != 'planned':
                  capability['legacy_status'] = capability['status']
                  capability['status'] = 'migration-required'
                  limitation = 'Existing implementation evidence is historical Rust/Electron oracle evidence and does not count as current Java capability acceptance'
                  if limitation not in capability['limitations']:
                      capability['limitations'].insert(0, limitation)
          capabilities_path.write_text(json.dumps(capabilities, indent=2) + '\n')

          platform_path = Path('crates/platform/src/lib.rs')
          platform = platform_path.read_text()
          old = 'assert!((score - 8.0).abs() < 1e-9);'
          if old not in platform:
              raise SystemExit('expected root truth-score assertion was not found')
          platform_path.write_text(platform.replace(old, 'assert!(score.abs() < 1e-9);', 1))

          mcp_test_path = Path('crates/platform/tests/mcp_stdio.rs')
          mcp_test = mcp_test_path.read_text()
          mcp_test = mcp_test.replace('\\"truthScore\\":8.00', '\\"truthScore\\":0.00', 1)
          mcp_test = mcp_test.replace(
              'M1 design kernel and desktop shell accepted',
              'Java 25 Swing migration in progress; Rust M1 retained as conformance oracle',
              1,
          )
          mcp_test_path.write_text(mcp_test)

          mcp_path = Path('crates/platform/src/bin/icstudio-mcp.rs')
          mcp = mcp_path.read_text()
          mcp = mcp.replace(
              'M1 design kernel and desktop shell accepted',
              'Java 25 Swing migration in progress; Rust M1 retained as conformance oracle',
              1,
          )
          mcp_path.write_text(mcp)

          wp6 = Path('.project/workpacks/WP-0006.yaml')
          wp6.write_text('''id: WP-0006
title: Java J0 reproducible factory
status: planned
priority: critical
milestone: J0
parent: WP-0005
spec: .project/decisions/ADR-0001-java25-swing-pivot.toml
branch: milestone/m0-reproducible-factory
acceptance:
  - Temurin 25.0.4+7 reference toolchain
  - Maven 3.9.16 wrapper reactor
  - JUnit 6.1.2 smoke tests
  - Windows macOS Linux native CI
  - reproducible non-root Linux Java image
  - Java dependency licence evidence
  - CycloneDX 2.9.3 SBOM
  - checkpoint CP-JAVA-M0-FACTORY
truth_on_acceptance: 2.0
m2_blocked: true
''')
          PY

      - name: Verify architecture contract and evidence parser
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          cargo fmt --all -- --check
          cargo test --locked -p icstudio-platform --all-targets

      - name: Commit accepted architecture
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .project crates/platform/src/lib.rs crates/platform/src/bin/icstudio-mcp.rs crates/platform/tests/mcp_stdio.rs
          git commit -m "architecture: accept Java 25 Swing authoritative stack"
          git push origin HEAD:milestone/m0-reproducible-factory
