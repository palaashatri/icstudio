name: Accept Java architecture

on:
  push:
    branches:
      - milestone/m0-reproducible-factory

permissions:
  contents: write

jobs:
  accept:
    if: github.repository == 'palaashatri/icstudio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: milestone/m0-reproducible-factory
          persist-credentials: true

      - name: Detect whether migration switch is pending
        id: pending
        shell: bash
        run: |
          if grep -q '^status = "proposed"$' .project/decisions/ADR-0001-java25-swing-pivot.toml; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply accepted architecture and live-truth reset
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          start = agents.index('# 5. High-level architecture')
          end = agents.index('# 8. Core data model')
          replacement = r'''# 5. High-level architecture

ICStudio is a **Java 25 application end to end**. Swing is the desktop substrate; the UI and engineering core share one authoritative in-process Java object model. Module boundaries exist for maintainability, testing, and deliberate fault containment, not to recreate a frontend/backend web architecture.

```text
