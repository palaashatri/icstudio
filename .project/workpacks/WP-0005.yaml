    test_cycle:
      failing_test: |
        @Test
        void crashingWorkerCannotTerminateOrCorruptParent() throws Exception {
            var project = fixture.persistedProject();
            var worker = WorkerProcess.start("abort");
            assertNotEquals(0, worker.waitFor());
            assertEquals(project.snapshot(), ProjectStore.open(project.path()).load().snapshot());
        }
      implementation: >-
        Use a separate `java` process with a versioned binary-safe envelope. Keep project state
        outside the worker and pass project/revision/request identity on every operation.
      green_command: ./mvnw -pl java/icstudio-worker -am test
      commit: 'feat(java-worker): port crash-isolated worker protocol'

  - task: 8
    name: Port CLI and MCP over the same Java services
    files:
      create:
        - java/icstudio-cli/pom.xml
        - java/icstudio-cli/src/main/java/dev/icstudio/cli/IcStudioCli.java
        - java/icstudio-mcp/pom.xml
