        Create CP-JAVA-M1-KERNEL, set M0 and M1 accepted, restore truth score to 8/100,
        and record the exact accepted commit plus workflow run. Do not delete legacy code in this task.
      commit: 'project(java): accept CP-JAVA-M1-KERNEL at 8 of 100'

  - task: 13
    name: Remove superseded Electron React and Rust application stack after accepted parity
    prerequisite: CP-JAVA-M1-KERNEL must exist and resume-check successfully
    files:
      delete_after_evidence_archive:
        - apps/workbench/**
