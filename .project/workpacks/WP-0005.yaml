        - java/icstudio-ui/src/test/java/dev/icstudio/ui/StudioTokensTest.java
        - java/icstudio-ui/src/test/java/dev/icstudio/ui/AccessibilityContractTest.java
    test_cycle:
      failing_test: |
        @Test
        void engineeringCanvasMaterialIsAlwaysOpaqueByDefault() {
            assertEquals(1.0f, StudioTokens.defaultOpacity(StudioMaterial.CANVAS));
        }
      implementation: >-
        Install FlatLaf 3.7.2 only as Swing plumbing; ICStudio owns fonts, spacing, control
        geometry, focus rings, semantic surfaces, motion durations, density modes, and accessible
        contrast/focus policies. Do not expose raw FlatLaf keys to application screens.
      green_command: ./mvnw -pl java/icstudio-ui -am test
      commit: 'feat(java-ui): establish ICStudio Swing design system'

  - task: 10
    name: Add Skija scene host and HIG-informed workbench shell
    files:
      create:
        - java/icstudio-ui/src/main/java/dev/icstudio/ui/scene/StudioScene.java
        - java/icstudio-ui/src/main/java/dev/icstudio/ui/scene/SkiaScenePanel.java
        - java/icstudio-ui/src/main/java/dev/icstudio/ui/workspace/ProjectWorkbench.java
        - java/icstudio-ui/src/main/java/dev/icstudio/ui/workspace/LibraryNavigator.java
