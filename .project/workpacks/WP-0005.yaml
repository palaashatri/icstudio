        - accepted workflow evidence references
      modify:
        - AGENTS.md
        - README.md
        - .project/capabilities.json
        - .project/workpacks/WP-0005.yaml
        - justfile
        - .github/workflows/ci.yml
        - .github/workflows/release-builds.yml
    test_cycle:
      required_checks:
        - repository search finds no production Electron React TypeScript Node dependency
        - repository search finds no production Rust backend dependency
        - ./mvnw -B -ntp verify passes from clean checkout
        - all three native CI platforms and Java container pass
        - CP-JAVA-M1-KERNEL resume-check passes
        - truth score remains 8/100
      commit: 'refactor(java): retire superseded Rust Electron application stack'

review_gates:
  after_each_task:
    - run task-local red/green tests
    - run impacted-module tests
    - review diff for architectural boundary violations
    - commit independently
  after_J0:
    - independent review of build reproducibility, licence policy, and truth score 2/100
  after_J1:
    - independent review of every CP-M1-KERNEL mandatory gate before restoring 8/100
  before_J2:
    - verify archived Rust oracle evidence remains sufficient to reproduce migration claims

self_review:
  spec_coverage:
    - authoritative Java language: covered by tasks 1-13
    - Swing design system: covered by tasks 9-12
