        - java/icstudio-result-db/src/main/java/dev/icstudio/results/ResultStore.java
        - java/icstudio-project/src/main/java/dev/icstudio/io/GdsRecordReader.java
        - java/icstudio-conformance/src/test/java/dev/icstudio/conformance/HeadlessSchemaOracleTest.java
    test_cycle:
      required_tests:
        - deterministic PDK serialization and layer-purpose mapping validation
        - structural CMOS inverter SPICE parse with source-line diagnostics
        - malformed/truncated GDS record length and parity rejection
        - result scalar-vector exact IEEE-754 bit-pattern round trip
