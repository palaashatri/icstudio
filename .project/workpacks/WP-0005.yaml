        - java/icstudio-mcp/src/test/java/dev/icstudio/mcp/McpProtocolTest.java
        - java/icstudio-conformance/src/test/java/dev/icstudio/conformance/CliMcpParityTest.java
    test_cycle:
      required_tests:
        - missing CLI option values return precise errors
        - MCP top-level id/method parsing ignores nested lookalikes
        - MCP locked protocol revision negotiation remains compatible with existing fixtures
        - CLI project summary bytes equal MCP structured project summary bytes
      implementation: >-
        Both surfaces call `ProjectQueries` and `CommandBus`; MCP may run as a separate process
        but must not independently parse authoritative project files or duplicate engineering semantics.
      green_command: ./mvnw -pl java/icstudio-cli,java/icstudio-mcp,java/icstudio-conformance -am test
      commit: 'feat(java-surfaces): port CLI and MCP shared services'

