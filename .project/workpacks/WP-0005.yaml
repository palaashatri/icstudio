        - java/icstudio-app/src/main/java/dev/icstudio/app/ICStudio.java
    test_cycle:
      required_tests:
        - workbench renders an immutable ProjectSnapshot and cannot mutate domain state directly
        - sidebar/inspector/toolbar use semantic materials while center engineering canvas remains controlled solid
        - keyboard traversal reaches library navigator, canvas, inspector, command/search entry, and bottom panel
        - theme switch keeps domain snapshot identity and revision unchanged
      implementation: >-
        Use Swing for window chrome, controls, menus, trees, tables and accessibility; use Skija
        0.143.17 only inside scene-host surfaces. Start with a project/library/cell/view explorer
        shell, not schematic editing, because M2 remains blocked until parity acceptance.
      green_command: ./mvnw -pl java/icstudio-ui,java/icstudio-app -am test
      commit: 'feat(java-ui): add Skia-backed M1 workbench shell'

  - task: 11
    name: Implement native material adapters with safe fallbacks
    files:
      create:
        - java/icstudio-platform/pom.xml
        - java/icstudio-platform/src/main/java/dev/icstudio/platform/Platform.java
        - java/icstudio-platform/src/main/java/dev/icstudio/platform/MacMaterialSupport.java
        - java/icstudio-platform/src/main/java/dev/icstudio/platform/WindowsMaterialSupport.java
        - java/icstudio-platform/src/main/java/dev/icstudio/platform/LinuxMaterialSupport.java
        - java/icstudio-platform/src/main/java/dev/icstudio/platform/SolidMaterialSupport.java
        - java/icstudio-platform/src/test/java/dev/icstudio/platform/MaterialFallbackTest.java
    test_cycle:
      failing_test: |
        @Test
        void unsupportedBlurFallsBackToOpaqueWithoutChangingRequestedSemanticRole() {
            var support = new SolidMaterialSupport();
            var result = support.resolve(StudioMaterial.SIDEBAR, true);
            assertEquals(StudioMaterial.SIDEBAR, result.role());
            assertFalse(result.backdropBlur());
            assertEquals(1.0f, result.opacity());
        }
      implementation: >-
        Keep FFM calls behind platform adapters. macOS may map semantic materials to AppKit
        visual-effect materials, Windows to supported composition APIs, and Linux to compositor
        capabilities where safely discoverable. Failure or unsupported capability must never block launch.
      green_command: ./mvnw -pl java/icstudio-platform,java/icstudio-ui -am test
      commit: 'feat(java-platform): add semantic native material adapters'

  - task: 12
    name: Prove Swing CLI MCP state equivalence and accept Java J1
    files:
      create:
