      green_command: ./mvnw -pl java/icstudio-pdk,java/icstudio-netlist-ir,java/icstudio-result-db,java/icstudio-conformance -am test
      commit: 'feat(java-ir): port M1 PDK netlist result and format scaffolds'

  - task: 7
    name: Port isolated worker lifecycle and typed protocol
    files:
      create:
        - java/icstudio-worker/pom.xml
        - java/icstudio-worker/src/main/java/dev/icstudio/worker/WorkerRequest.java
        - java/icstudio-worker/src/main/java/dev/icstudio/worker/WorkerResponse.java
